services:
  - type: web
    name: udaanpath-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "cd backend && python data/seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_NAME
        value: UdaanPath
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: udaanpath-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://frontend-five-psi-43.vercel.app"]'
      - key: SECRET_KEY
        generateValue: true

  # Frontend: Vite + React single-page app served as static files.
  - type: web
    name: udaanpath-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: udaanpath-db
    region: singapore
    plan: free
    databaseName: udaanpath
    user: udaanpath_user
